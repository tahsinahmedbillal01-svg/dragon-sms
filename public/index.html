<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 DRAGON SMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f6f9; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 5%; border-bottom: 1px solid #ddd; }
        .logo { font-size: 22px; font-weight: bold; color: #1a1a1a; }
        .user-panel { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-success { background: #16a34a; color: #fff; }
        
        .container { padding: 20px 5%; }
        .balance-card { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .view-controls { display: flex; justify-content: space-between; align-items: center; background: #2563eb; color: #fff; padding: 10px 15px; border-radius: 8px 8px 0 0; }
        .toggle-btns button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; margin-left: 10px; }
        
        /* Grid and List Styles */
        .product-container { background: #fff; padding: 20px; border-radius: 0 0 8px 8px; }
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .list-view { display: flex; flex-direction: column; gap: 10px; }
        
        .product-card { border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; background: #fff; }
        .list-view .product-card { display: flex; justify-content: space-between; align-items: center; }
        
        /* Modals */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
        .modal-content { background:#fff; padding:20px; border-radius:8px; width:350px; }
        .modal-content input, .modal-content textarea { width:100%; padding:8px; margin:8px 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐉 DRAGON SMS</div>
        <div class="user-panel">
            <span id="user-display">Not Logged In</span>
            <button class="btn btn-primary" onclick="openLogin()">Email Login</button>
            <button class="btn btn-success" onclick="openDeposit()">bKash Deposit</button>
            <button class="btn" style="background:#dc2626; color:#fff;" onclick="openAdmin()">Admin Add Stock</button>
        </div>
    </header>

    <div class="container">
        <div class="balance-card">
            <h3>User Balance: <span id="user-balance">$0.00</span> USD</h3>
            <button class="btn btn-primary" onclick="loadOrders()">Order History</button>
        </div>

        <div class="view-controls">
            <span>Available Accounts</span>
            <div class="toggle-btns">
                <button onclick="setView('grid')"><i class="fas fa-th-large"></i></button>
                <button onclick="setView('list')"><i class="fas fa-list"></i></button>
            </div>
        </div>

        <div id="product-list" class="product-container grid-view">
            <!-- Products will be dynamically loaded here -->
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h3>Enter Email</h3>
            <input type="email" id="login-email" placeholder="your@email.com">
            <button class="btn btn-primary" onclick="login()">Login</button>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div id="deposit-modal" class="modal">
        <div class="modal-content">
            <h3>bKash Deposit (Auto USD)</h3>
            <p style="font-size:12px; color:gray;">1 USD = 120 BDT</p>
            <input type="number" id="deposit-bdt" placeholder="Amount in BDT (e.g. 120)">
            <button class="btn btn-success" onclick="depositBkash()">Deposit Now</button>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h3>Admin: Add Listing & Stock</h3>
            <input type="text" id="prod-title" placeholder="Title (e.g. Outlook Fresh)">
            <input type="text" id="prod-cat" placeholder="Category (e.g. Outlook)">
            <input type="number" id="prod-price" placeholder="Price in USD (e.g. 0.50)">
            <textarea id="prod-accounts" placeholder="Paste accounts line by line (email:pass)"></textarea>
            <button class="btn btn-primary" onclick="addProduct()">Upload Accounts</button>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('userEmail') || '';
        if(currentUser) document.getElementById('user-display').innerText = currentUser;

        function setView(type) {
            const list = document.getElementById('product-list');
            if(type === 'list') {
                list.className = 'product-container list-view';
            } else {
                list.className = 'product-container grid-view';
            }
        }

        function openLogin() { document.getElementById('login-modal').style.display = 'flex'; }
        function openDeposit() { document.getElementById('deposit-modal').style.display = 'flex'; }
        function openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; }

        function login() {
            const email = document.getElementById('login-email').value;
            if(email) {
                currentUser = email;
                localStorage.setItem('userEmail', email);
                document.getElementById('user-display').innerText = email;
                document.getElementById('login-modal').style.display = 'none';
            }
        }

        async function fetchProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            
            data.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <h4>${p.title}</h4>
                            <p style="font-size:12px; color:gray;">Stock: ${p.stockCount}</p>
                            <h3 style="color:#2563eb;">$${p.price}</h3>
                        </div>
                        <button class="btn btn-primary" onclick="buyProduct(${p.id})">Buy Now</button>
                    </div>
                `;
            });
        }

        async function addProduct() {
            const title = document.getElementById('prod-title').value;
            const category = document.getElementById('prod-cat').value;
            const price = document.getElementById('prod-price').value;
            const accounts = document.getElementById('prod-accounts').value;

            await fetch('/api/admin/add-product', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title, category, price, accounts })
            });

            alert('Product and accounts uploaded successfully!');
            document.getElementById('admin-modal').style.display = 'none';
            fetchProducts();
        }

        async function depositBkash() {
            const amountBDT = document.getElementById('deposit-bdt').value;
            if(!currentUser) return alert('Please login with your email first!');

            const res = await fetch('/api/deposit/bkash', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentUser, amountBDT })
            });
            const data = await res.json();
            document.getElementById('user-balance').innerText = '$' + data.balance;
            alert(data.message);
            document.getElementById('deposit-modal').style.display = 'none';
        }

        async function buyProduct(id) {
            if(!currentUser) return alert('Please login first!');
            const res = await fetch('/api/buy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentUser, productId: id })
            });
            const data = await res.json();
            if(data.success) {
                alert('Account Purchased: ' + data.account);
                document.getElementById('user-balance').innerText = '$' + data.remainingBalance;
                fetchProducts();
            } else {
                alert(data.message);
            }
        }

        fetchProducts();
    </script>
</body>
</html>
