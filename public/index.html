<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 DRAGON SMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f6f9; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 5%; border-bottom: 1px solid #ddd; }
        .logo { font-size: 22px; font-weight: bold; color: #1a1a1a; }
        .user-panel { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-success { background: #16a34a; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; }

        .cat-bar { display: flex; gap: 10px; background: #fff; padding: 10px 5%; border-bottom: 1px solid #e5e7eb; overflow-x: auto; }
        .cat-btn { padding: 6px 12px; background: #f3f4f6; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .cat-btn.active { background: #2563eb; color: white; }

        .container { padding: 20px 5%; }
        .balance-card { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }

        .view-controls { display: flex; justify-content: space-between; align-items: center; background: #2563eb; color: #fff; padding: 10px 15px; border-radius: 8px 8px 0 0; }
        .toggle-btns button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; margin-left: 10px; }

        .product-container { background: #fff; padding: 20px; border-radius: 0 0 8px 8px; }
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .list-view { display: flex; flex-direction: column; gap: 10px; }

        .product-card { border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; background: #fff; display: flex; flex-direction: column; justify-content: space-between; }
        .list-view .product-card { flex-direction: row; align-items: center; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:100; }
        .modal-content { background:#fff; padding:20px; border-radius:8px; width:360px; max-height:80vh; overflow-y:auto; }
        .modal-content input, .modal-content select, .modal-content textarea { width:100%; padding:8px; margin:8px 0; border:1px solid #ccc; border-radius:4px; }
        
        .method-select { display: flex; gap: 10px; margin: 10px 0; }
        .method-btn { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; text-align: center; font-weight: bold; }
        .method-btn.selected { border-color: #2563eb; background: #eff6ff; color: #2563eb; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐉 DRAGON SMS</div>
        <div class="user-panel">
            <span id="user-display" style="font-weight: bold;">Not Logged In</span>
            <button class="btn btn-primary" id="login-btn-nav" onclick="openLogin()">Email Login</button>
            <button class="btn btn-success" onclick="openDeposit()">Deposit</button>
        </div>
    </header>

    <div class="cat-bar" id="category-bar">
        <div class="cat-btn active" onclick="filterCategory('All')">All Categories</div>
    </div>

    <div class="container">
        <div class="balance-card">
            <h3>Balance: <span id="user-balance" style="color:#16a34a;">$0.00</span> USD</h3>
            <button class="btn btn-primary" onclick="openOrders()">Order History</button>
        </div>

        <div class="view-controls">
            <span>Available Listings</span>
            <div class="toggle-btns">
                <button onclick="setView('grid')"><i class="fas fa-th-large"></i></button>
                <button onclick="setView('list')"><i class="fas fa-list"></i></button>
            </div>
        </div>

        <div id="product-list" class="product-container grid-view"></div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h3>User Login</h3>
            <input type="email" id="login-email" placeholder="Enter your email">
            <button class="btn btn-primary" style="width:100%;" onclick="login()">Login</button>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div id="deposit-modal" class="modal">
        <div class="modal-content">
            <h3>Deposit Funds</h3>
            <p style="font-size:12px; color:gray;">Select Payment Method:</p>
            <div class="method-select">
                <div class="method-btn selected" id="m-bkash" onclick="selectMethod('bkash')">bKash (BDT)</div>
                <div class="method-btn" id="m-crypto" onclick="selectMethod('crypto')">Crypto (USD)</div>
            </div>
            <div id="deposit-note" style="font-size:11px; color:#2563eb; margin-bottom:5px;">Rate: 120 BDT = 1 USD</div>
            <input type="number" id="deposit-amount" placeholder="Enter Amount">
            <button class="btn btn-success" style="width:100%;" onclick="processDeposit()">Submit Deposit</button>
        </div>
    </div>

    <!-- Orders Modal -->
    <div id="orders-modal" class="modal">
        <div class="modal-content" style="width:450px;">
            <h3>My Purchase History</h3>
            <div id="orders-list" style="margin-top:10px;"></div>
            <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="closeModal('orders-modal')">Close</button>
        </div>
    </div>

    <!-- Secret Admin Modal -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h3>Admin Management</h3>
            
            <h4 style="margin-top:10px;">Add Category</h4>
            <input type="text" id="new-cat-input" placeholder="Category Name">
            <button class="btn btn-primary" style="width:100%;" onclick="addCategory()">Add Category</button>

            <hr style="margin:15px 0;">

            <h4>Add Product Listing</h4>
            <select id="prod-cat-select"></select>
            <input type="text" id="prod-title" placeholder="Listing Title">
            <input type="number" id="prod-price" placeholder="Price in USD (e.g. 0.50)">
            <textarea id="prod-accounts" placeholder="Paste accounts line by line (email:pass)"></textarea>
            <button class="btn btn-success" style="width:100%;" onclick="addProduct()">Upload Listing</button>
            <button class="btn btn-danger" style="width:100%; margin-top:10px;" onclick="closeModal('admin-modal')">Close Admin</button>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('userEmail') || '';
        let selectedMethod = 'bkash';
        let selectedCategory = 'All';
        let allProducts = [];
        let isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';

        // Shortcut for Secret Admin Panel (Ctrl + Shift + A)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'A') {
                openAdmin();
            }
        });

        if (currentUser) {
            document.getElementById('user-display').innerText = currentUser;
            fetchBalance();
        }

        function setView(type) {
            document.getElementById('product-list').className = 'product-container ' + (type === 'list' ? 'list-view' : 'grid-view');
        }

        function openLogin() { document.getElementById('login-modal').style.display = 'flex'; }
        function openDeposit() { document.getElementById('deposit-modal').style.display = 'flex'; }
        function openAdmin() { fetchCategories(); document.getElementById('admin-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function login() {
            const email = document.getElementById('login-email').value;
            if (email) {
                currentUser = email;
                localStorage.setItem('userEmail', email);
                document.getElementById('user-display').innerText = email;
                closeModal('login-modal');
                fetchBalance();
            }
        }

        function selectMethod(method) {
            selectedMethod = method;
            document.getElementById('m-bkash').className = 'method-btn ' + (method === 'bkash' ? 'selected' : '');
            document.getElementById('m-crypto').className = 'method-btn ' + (method === 'crypto' ? 'selected' : '');
            document.getElementById('deposit-note').innerText = method === 'bkash' ? 'Rate: 120 BDT = 1 USD' : 'Direct USDT / Crypto (1:1 USD)';
        }

        async function fetchBalance() {
            if (!currentUser) return;
            const res = await fetch('/api/user/balance/' + currentUser);
            const data = await res.json();
            document.getElementById('user-balance').innerText = '$' + data.balance.toFixed(2);
        }

        async function processDeposit() {
            const amount = document.getElementById('deposit-amount').value;
            if (!currentUser) return alert('Please login first!');

            const res = await fetch('/api/deposit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentUser, method: selectedMethod, amount: parseFloat(amount) })
            });
            const data = await res.json();
            alert(data.message);
            fetchBalance();
            closeModal('deposit-modal');
        }

        async function fetchCategories() {
            const res = await fetch('/api/categories');
            const categories = await res.json();
            
            const catBar = document.getElementById('category-bar');
            catBar.innerHTML = `<div class="cat-btn ${selectedCategory === 'All' ? 'active' : ''}" onclick="filterCategory('All')">All Categories</div>`;
            
            const select = document.getElementById('prod-cat-select');
            select.innerHTML = '';

            categories.forEach(cat => {
                catBar.innerHTML += `<div class="cat-btn ${selectedCategory === cat ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</div>`;
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            fetchCategories();
            renderProducts();
        }

        async function fetchProducts() {
            const res = await fetch('/api/products');
            allProducts = await res.json();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = '';

            const filtered = selectedCategory === 'All' ? allProducts : allProducts.filter(p => p.category === selectedCategory);

            filtered.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <span style="font-size:11px; color:#2563eb; font-weight:bold;">[${p.category}]</span>
                            <h4>${p.title}</h4>
                            <p style="font-size:12px; color:gray;">Stock: ${p.stockCount}</p>
                            <h3 style="color:#16a34a; margin:5px 0;">$${p.price.toFixed(2)}</h3>
                        </div>
                        <div>
                            <button class="btn btn-primary" style="width:100%; margin-top:5px;" onclick="buyProduct(${p.id})">Buy Now</button>
                            ${isAdmin ? `<button class="btn btn-danger" style="width:100%; margin-top:5px;" onclick="deleteProduct(${p.id})">Delete</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        async function addCategory() {
            const cat = document.getElementById('new-cat-input').value;
            if (!cat) return;
            await fetch('/api/admin/add-category', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ category: cat })
            });
            document.getElementById('new-cat-input').value = '';
            fetchCategories();
        }

        async function addProduct() {
            const category = document.getElementById('prod-cat-select').value;
            const title = document.getElementById('prod-title').value;
            const price = document.getElementById('prod-price').value;
            const accounts = document.getElementById('prod-accounts').value;

            await fetch('/api/admin/add-product', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title, category, price, accounts })
            });

            alert('Listing added!');
            closeModal('admin-modal');
            fetchProducts();
        }

        async function deleteProduct(id) {
            if (confirm('Delete this listing?')) {
                await fetch('/api/admin/delete-product/' + id, { method: 'DELETE' });
                fetchProducts();
            }
        }

        async function buyProduct(id) {
            if (!currentUser) return alert('Please login first!');
            const res = await fetch('/api/buy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentUser, productId: id })
            });
            const data = await res.json();
            if (data.success) {
                alert('Purchased Account: ' + data.account);
                fetchBalance();
                fetchProducts();
            } else {
                alert(data.message);
            }
        }

        async function openOrders() {
            if (!currentUser) return alert('Please login first!');
            const res = await fetch('/api/orders/' + currentUser);
            const orders = await res.json();
            const container = document.getElementById('orders-list');
            container.innerHTML = '';

            if (orders.length === 0) container.innerHTML = '<p>No orders found.</p>';

            orders.forEach(o => {
                container.innerHTML += `
                    <div style="border-bottom:1px solid #ddd; padding:8px 0;">
                        <strong>${o.productTitle}</strong> - $${o.price}<br>
                        <code style="background:#eee; padding:2px 4px;">${o.accountData}</code><br>
                        <small style="color:gray;">${o.date}</small>
                    </div>
                `;
            });
            document.getElementById('orders-modal').style.display = 'flex';
        }

        fetchCategories();
        fetchProducts();
    </script>
</body>
</html>
